<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — Товары из Boxing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: #101114; color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main { max-width: 760px; margin: auto; }
    h1 { font-size: 25px; }
    input, textarea, button {
      width: 100%; padding: 12px; margin: 6px 0;
      border-radius: 9px; font-size: 16px;
    }
    input, textarea {
      color: #fff; background: #1c1e23; border: 1px solid #41434a;
    }
    button {
      border: 0; background: #f4c542; color: #111;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .secondary { background: #353840; color: white; }
    .danger { background: #c93636; color: white; }
    .panel, .product {
      background: #1b1d22; border: 1px solid #34363d;
      padding: 14px; margin: 14px 0; border-radius: 12px;
    }
    .product img { width: 100%; max-height: 230px; object-fit: contain; }
    .muted { color: #b8bac2; font-size: 14px; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>🛍️ Управление товарами</h1>
  <p class="muted">Товары из Boxing</p>

  <section id="loginPanel" class="panel">
    <h2>Вход администратора</h2>
    <input id="email" type="email" placeholder="Электронная почта"
      autocomplete="username">
    <input id="password" type="password" placeholder="Пароль"
      autocomplete="current-password">
    <button id="loginBtn" type="button">Войти</button>
  </section>

  <section id="adminPanel" class="hidden">

    <div class="panel">
      <h2>⭐ Модерация отзывов</h2>
      <p class="muted">Новые отзывы сначала ожидают проверки. Одобренные появятся в магазине.</p>
      <button id="refreshReviewsBtn" class="secondary" type="button">Обновить отзывы</button>
      <div id="reviews"></div>
    </div>

    <div class="panel">
      <button id="logoutBtn" class="secondary" type="button">Выйти</button>
      <h2 id="formTitle">Добавить товар</h2>

      <form id="productForm">
        <input id="productName" required maxlength="200"
          placeholder="Название товара">
        <input id="productPrice" type="number" required min="0"
          step="0.01" placeholder="Цена">
        <input id="productCategory" required maxlength="100"
          placeholder="Категория">
        <textarea id="productDescription" rows="3"
          placeholder="Описание товара"></textarea>

        <label for="productImage">Фотографии товара (до 2 штук, каждая до 4 МБ)</label>
        <input id="productImage" type="file" accept="image/*" multiple>
        <div id="previews" style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0"></div>

        <button id="saveBtn" type="submit">Добавить товар</button>
        <button id="cancelBtn" class="secondary hidden"
          type="button">Отмена редактирования</button>
      </form>
    </div>

    <h2>Товары в магазине</h2>
    <button id="refreshBtn" class="secondary" type="button">
      Обновить список
    </button>
    <div id="products"></div>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://vltyoaukpghgknwszzwf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_031wgOOIxZOZkwwnY9jlyg_SZZlRMDr";
  const TABLE = "store_products";
  const BUCKET = "product-images";

  const $ = id => document.getElementById(id);
  const client = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  let editingId = null;
  let currentImageUrl = null;
  let products = [];
  let reviews = [];

  function message(text, error = false) {
    $("message").textContent = text;
    $("message").style.color = error ? "#ff7777" : "#9ee6a4";
  }

  function showAdmin(isLoggedIn) {
    $("loginPanel").classList.toggle("hidden", isLoggedIn);
    $("adminPanel").classList.toggle("hidden", !isLoggedIn);
  }

  function imageUrls(value) {
    if (!value) return [];
    try {
      const parsed = JSON.parse(value);
      if (Array.isArray(parsed)) return parsed.filter(url => typeof url === "string" && url);
    } catch (_) {}
    return [value];
  }

  function showPreviews(urls) {
    const container = $("previews");
    container.replaceChildren();
    urls.slice(0, 2).forEach((url, index) => {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "Фото товара " + (index + 1);
      img.style.cssText = "width:calc(50% - 5px);max-height:200px;object-fit:contain;background:#101114;border-radius:8px";
      container.appendChild(img);
    });
  }

  function resetForm() {
    editingId = null;
    currentImageUrl = null;
    $("productForm").reset();
    $("formTitle").textContent = "Добавить товар";
    $("saveBtn").textContent = "Добавить товар";
    $("cancelBtn").classList.add("hidden");
    $("previews").replaceChildren();
  }

  function publicImageUrl(path) {
    return client.storage.from(BUCKET).getPublicUrl(path)
      .data.publicUrl;
  }


  async function verifyAdmin() {
    const { data: sessionData, error: sessionError } = await client.auth.getSession();
    if (sessionError) throw sessionError;
    const user = sessionData.session && sessionData.session.user;
    if (!user) return false;

    const { data, error } = await client
      .from("store_admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) throw error;
    return !!data;
  }

  async function loadReviews() {
    const button = $("refreshReviewsBtn");
    if (button) button.disabled = true;
    try {
      const { data, error } = await client
        .from("store_reviews")
        .select("id, product_id, product_name, author_name, rating, review_text, status, created_at")
        .eq("status", "pending")
        .order("created_at", { ascending: true });
      if (error) throw error;
      reviews = data || [];
      renderReviews();
    } catch (error) {
      $("reviews").textContent = "Не удалось загрузить отзывы: " + error.message;
    } finally {
      if (button) button.disabled = false;
    }
  }

  function renderReviews() {
    const container = $("reviews");
    container.replaceChildren();
    if (!reviews.length) {
      container.textContent = "Новых отзывов нет 🎉";
      return;
    }

    reviews.forEach(review => {
      const card = document.createElement("article");
      card.className = "product";
      const title = document.createElement("h3");
      title.textContent = review.product_name || ("Товар №" + review.product_id);
      card.appendChild(title);

      const meta = document.createElement("p");
      const date = review.created_at ? new Date(review.created_at).toLocaleString("ru-RU") : "";
      meta.textContent = (review.author_name || "Без имени") + " · " +
        "★".repeat(Math.max(0, Math.min(5, Number(review.rating) || 0)) ) +
        " · " + date;
      card.appendChild(meta);

      const body = document.createElement("p");
      body.style.whiteSpace = "pre-wrap";
      body.textContent = review.review_text || "";
      card.appendChild(body);

      const approve = document.createElement("button");
      approve.type = "button";
      approve.textContent = "✅ Одобрить";
      approve.addEventListener("click", () => moderateReview(review, "approved", approve, reject));
      card.appendChild(approve);

      const reject = document.createElement("button");
      reject.type = "button";
      reject.className = "danger";
      reject.textContent = "❌ Отклонить";
      reject.addEventListener("click", () => moderateReview(review, "rejected", reject, approve));
      card.appendChild(reject);
      container.appendChild(card);
    });
  }

  async function moderateReview(review, status, button, otherButton) {
    button.disabled = true;
    otherButton.disabled = true;
    message(status === "approved" ? "Одобряю отзыв…" : "Отклоняю отзыв…");
    try {
      const { data, error } = await client
        .from("store_reviews")
        .update({ status })
        .eq("id", review.id)
        .eq("status", "pending")
        .select("id");
      if (error) throw error;
      if (!data || !data.length) {
        throw new Error("Отзыв не изменён. Проверь права администратора в Supabase.");
      }
      message(status === "approved" ? "Отзыв одобрен и появится в магазине." : "Отзыв отклонён.");
      await loadReviews();
    } catch (error) {
      message("Не удалось изменить отзыв: " + error.message, true);
      button.disabled = false;
      otherButton.disabled = false;
    }
  }

  async function loadProducts() {
    $("refreshBtn").disabled = true;
    message("Загружаю товары…");

    try {
      const { data, error } = await client
        .from(TABLE)
        .select("*")
        .order("id", { ascending: false });

      if (error) throw error;

      products = data || [];
      renderProducts();
      message("Товаров загружено: " + products.length);
    } catch (error) {
      message("Не удалось загрузить товары: " + error.message, true);
    } finally {
      $("refreshBtn").disabled = false;
    }
  }

  function renderProducts() {
    const container = $("products");
    container.replaceChildren();

    if (!products.length) {
      container.textContent = "Товаров пока нет.";
      return;
    }

    products.forEach(product => {
      const card = document.createElement("article");
      card.className = "product";

      const title = document.createElement("h3");
      title.textContent = product.name || "Без названия";
      card.appendChild(title);

      imageUrls(product.image_url).forEach((url, index) => {
        const img = document.createElement("img");
        img.src = url;
        img.alt = (product.name || "Фото товара") + " — фото " + (index + 1);
        img.loading = "lazy";
        card.appendChild(img);
      });

      const price = document.createElement("p");
      price.textContent = "Цена: " + product.price + " ₽";
      card.appendChild(price);

      const status = document.createElement("p");
      status.textContent = product.sold ? "🔴 Статус: ПРОДАНО" : product.reserved ? "🟡 Статус: ЗАБРОНИРОВАНО" : "🟢 Статус: В НАЛИЧИИ";
      status.style.fontWeight = "bold";
      status.style.color = product.sold ? "#ff8a8a" : product.reserved ? "#fbbf24" : "#9ee6a4";
      card.appendChild(status);

      const reserveToggle = document.createElement("button");
      reserveToggle.type = "button";
      reserveToggle.textContent = product.reserved ? "↩️ Снять бронь" : "🟡 Забронировать товар";
      reserveToggle.className = "secondary";
      reserveToggle.disabled = !!product.sold;
      reserveToggle.title = product.sold ? "Проданный товар нельзя забронировать" : "";
      reserveToggle.addEventListener("click", () => setReservedStatus(product, !product.reserved, reserveToggle));
      card.appendChild(reserveToggle);

      const soldToggle = document.createElement("button");
      soldToggle.type = "button";
      soldToggle.className = "secondary";
      soldToggle.textContent = product.sold ? "↩️ Вернуть в наличие" : "🔴 Отметить как проданный";
      soldToggle.addEventListener("click", () => setSoldStatus(product, !product.sold, soldToggle));
      card.appendChild(soldToggle);

      const category = document.createElement("p");
      category.textContent = "Категория: " + (product.category || "—");
      card.appendChild(category);

      const description = document.createElement("p");
      description.textContent = product.description || "";
      card.appendChild(description);

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "secondary";
      edit.textContent = "✏️ Редактировать";
      edit.addEventListener("click", () => editProduct(product));
      card.appendChild(edit);

      const del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "🗑️ Удалить";
      del.addEventListener("click", () => deleteProduct(product.id, del));
      card.appendChild(del);

      container.appendChild(card);
    });
  }

  async function setReservedStatus(product, reserved, button) {
    button.disabled = true;
    message(reserved ? "Ставлю бронь…" : "Снимаю бронь…");
    try {
      const { data, error } = await client.from(TABLE)
        .update({ reserved })
        .eq("id", product.id)
        .select("id,reserved");
      if (error) throw error;
      if (!data || !data.length) throw new Error("Статус брони не изменён. Проверь права UPDATE в Supabase.");
      product.reserved = reserved;
      renderProducts();
      message(reserved ? "Товар забронирован. На фото появится плашка «БРОНЬ»." : "Бронь снята.");
    } catch (error) {
      message("Не удалось изменить бронь: " + error.message, true);
      button.disabled = false;
    }
  }

  async function setSoldStatus(product, sold, button) {
    button.disabled = true;
    message(sold ? "Отмечаю товар как проданный…" : "Возвращаю товар в наличие…");
    try {
      const { data, error } = await client.from(TABLE)
        .update({ sold })
        .eq("id", product.id)
        .select("id,sold");
      if (error) throw error;
      if (!data || !data.length) throw new Error("Статус не изменён. Проверь права UPDATE в Supabase.");
      product.sold = sold;
      renderProducts();
      message(sold ? "Товар отмечен как проданный." : "Товар снова доступен для покупки.");
    } catch (error) {
      message("Не удалось изменить статус: " + error.message, true);
      button.disabled = false;
    }
  }

  function editProduct(product) {
    editingId = product.id;
    currentImageUrl = product.image_url || null;

    $("productName").value = product.name || "";
    $("productPrice").value = product.price ?? "";
    $("productCategory").value = product.category || "";
    $("productDescription").value = product.description || "";

    $("formTitle").textContent = "Редактировать товар";
    $("saveBtn").textContent = "Сохранить изменения";
    $("cancelBtn").classList.remove("hidden");

    showPreviews(imageUrls(currentImageUrl));

    window.scrollTo({ top: 0, behavior: "smooth" });
    message("Редактируешь товар №" + product.id);
  }

  async function deleteProduct(id, button) {
    if (id === undefined || id === null || id === "") {
      message("Ошибка: у товара отсутствует ID. Удаление отменено.", true);
      return;
    }

    if (!confirm("Точно удалить этот товар? Это действие нельзя отменить.")) {
      return;
    }

    button.disabled = true;
    message("Удаляю товар №" + id + "…");

    try {
      const { data, error } = await client
        .from(TABLE)
        .delete()
        .eq("id", id)
        .select("id");

      if (error) throw error;

      if (!data || data.length === 0) {
        throw new Error(
          "Supabase не удалил строку. Проверь права DELETE (RLS) " +
          "для таблицы products и войди в аккаунт продавца."
        );
      }

      if (String(editingId) === String(id)) resetForm();

      message("Товар №" + id + " удалён.");
      await loadProducts();
    } catch (error) {
      message("Не удалось удалить товар:\n" + error.message, true);
      button.disabled = false;
    }
  }

  $("productImage").addEventListener("change", () => {
    const files = Array.from($("productImage").files || []);
    if (files.length > 2) {
      message("Можно выбрать не больше 2 фотографий.", true);
      $("productImage").value = "";
      showPreviews(imageUrls(currentImageUrl));
      return;
    }
    const invalid = files.find(file => !file.type.startsWith("image/") || file.size > 4 * 1024 * 1024);
    if (invalid) {
      message(!invalid.type.startsWith("image/")
        ? "Выбери только файлы изображений."
        : "Каждая фотография должна быть не больше 4 МБ.", true);
      $("productImage").value = "";
      showPreviews(imageUrls(currentImageUrl));
      return;
    }
    if (files.length) {
      showPreviews(files.map(file => URL.createObjectURL(file)));
    } else {
      showPreviews(imageUrls(currentImageUrl));
    }
  });

  $("productForm").addEventListener("submit", async event => {
    event.preventDefault();
    $("saveBtn").disabled = true;

    try {
      const { data: authData } = await client.auth.getSession();
      if (!authData.session) {
        throw new Error("Сессия закончилась. Войди в админку снова.");
      }

      const payload = {
        name: $("productName").value.trim(),
        price: Number($("productPrice").value),
        category: $("productCategory").value.trim(),
        description: $("productDescription").value.trim()
      };

      if (!payload.name || !payload.category ||
          !Number.isFinite(payload.price) || payload.price < 0) {
        throw new Error("Проверь название, категорию и цену.");
      }

      const files = Array.from($("productImage").files || []);
      if (files.length > 2) throw new Error("Можно добавить не больше 2 фотографий.");
      const oversized = files.find(file => file.size > 4 * 1024 * 1024);
      if (oversized) throw new Error("Каждая фотография должна быть не больше 4 МБ.");
      if (files.some(file => !file.type.startsWith("image/"))) {
        throw new Error("Выбери только файлы изображений.");
      }

      if (files.length) {
        message("Загружаю фотографии…");
        const uploadedUrls = [];
        for (const file of files) {
          const ext = (file.name.split(".").pop() || "jpg")
            .toLowerCase().replace(/[^a-z0-9]/g, "");
          const path = Date.now() + "-" +
            Math.random().toString(36).slice(2) + "." + ext;
          const { error: uploadError } = await client.storage
            .from(BUCKET)
            .upload(path, file, {
              upsert: false,
              contentType: file.type
            });
          if (uploadError) throw uploadError;
          uploadedUrls.push(publicImageUrl(path));
        }
        payload.image_url = JSON.stringify(uploadedUrls);
      } else if (!editingId) {
        payload.image_url = "";
      }

      message("Сохраняю товар…");

      let result;
      if (editingId !== null) {
        result = await client.from(TABLE)
          .update(payload)
          .eq("id", editingId)
          .select("id");
      } else {
        result = await client.from(TABLE)
          .insert(payload)
          .select("id");
      }

      if (result.error) throw result.error;
      if (!result.data || !result.data.length) {
        throw new Error(
          "Запись не подтверждена. Проверь права INSERT/UPDATE в Supabase."
        );
      }

      resetForm();
      message("Товар успешно сохранён.");
      await loadProducts();
    } catch (error) {
      message("Ошибка сохранения:\n" + error.message, true);
    } finally {
      $("saveBtn").disabled = false;
    }
  });

  $("loginBtn").addEventListener("click", async () => {
    $("loginBtn").disabled = true;
    try {
      const { error } = await client.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });
      if (error) throw error;

      const isAdmin = await verifyAdmin();
      if (!isAdmin) {
        await client.auth.signOut();
        showAdmin(false);
        throw new Error("Этот аккаунт не добавлен в store_admins. Доступ запрещён.");
      }

      showAdmin(true);
      await Promise.all([loadProducts(), loadReviews()]);
    } catch (error) {
      message("Ошибка входа: " + error.message, true);
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  $("password").addEventListener("keydown", event => {
    if (event.key === "Enter") $("loginBtn").click();
  });

  $("logoutBtn").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    if (error) {
      message("Ошибка выхода: " + error.message, true);
      return;
    }
    showAdmin(false);
    resetForm();
    $("reviews").replaceChildren();
    reviews = [];
    message("Ты вышел из админки.");
  });

  $("cancelBtn").addEventListener("click", resetForm);
  $("refreshBtn").addEventListener("click", loadProducts);
  $("refreshReviewsBtn").addEventListener("click", loadReviews);

  client.auth.getSession().then(({ data, error }) => {
    if (error) {
      message("Ошибка проверки сессии: " + error.message, true);
      return;
    }
    if (!data.session) {
      showAdmin(false);
      return;
    }
    verifyAdmin().then(isAdmin => {
      showAdmin(isAdmin);
      if (isAdmin) Promise.all([loadProducts(), loadReviews()]);
      else {
        client.auth.signOut();
        message("Этот аккаунт не добавлен в store_admins. Доступ запрещён.", true);
      }
    }).catch(err => {
      showAdmin(false);
      message("Не удалось проверить права администратора: " + err.message, true);
    });
  });
})();
</script>
</body>
</html>
